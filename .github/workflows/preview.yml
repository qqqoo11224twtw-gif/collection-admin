name: PR Preview

# Each PR gets an isolated alchemy stage (pr-<PR_NUMBER>) with its own
# Worker, KV, D1, etc. Closing the PR destroys the stage. PR previews
# reuse the dev stage's env files — alchemy.run.ts auto-skips custom
# domain env vars for pr-* stages and always uses workers.dev URLs.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev, main]

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Hard cap: a hung job must never burn hours of Actions quota.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Inject env files
        run: |
          echo "${{ secrets.ENV_ALCHEMY }}" > .alchemy.env
          echo "${{ secrets.ENV_SERVER_DEV }}" > apps/server/.dev.env
          echo "${{ secrets.ENV_WEB_DEV }}" > apps/web/.dev.env

      - name: Deploy PR preview
        run: pnpm run deploy:pr
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve preview URLs
        id: urls
        run: |
          URLS=$(node \
            --env-file=.alchemy.env \
            --env-file=apps/server/.dev.env \
            scripts/resolve-urls.ts --stage "$PR_STAGE")
          echo "web=$(echo "$URLS" | jq -r .web)" >> "$GITHUB_OUTPUT"
          echo "server=$(echo "$URLS" | jq -r .server)" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URLs
        uses: actions/github-script@v7
        env:
          WEB_URL: ${{ steps.urls.outputs.web }}
          SERVER_URL: ${{ steps.urls.outputs.server }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = `## 🔗 Preview Deployment\n\n` +
              `| Service | URL |\n|---------|-----|\n` +
              `| Frontend | ${process.env.WEB_URL} |\n` +
              `| Server | ${process.env.SERVER_URL} |\n\n` +
              `_Updated: ${new Date().toISOString()}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 🔗 Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  destroy-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    # Hard cap: a hung job must never burn hours of Actions quota.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PR_STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - name: Inject env files
        run: |
          echo "${{ secrets.ENV_ALCHEMY }}" > .alchemy.env
          echo "${{ secrets.ENV_SERVER_DEV }}" > apps/server/.dev.env
          echo "${{ secrets.ENV_WEB_DEV }}" > apps/web/.dev.env

      - name: Destroy PR preview
        run: pnpm run destroy:pr
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
