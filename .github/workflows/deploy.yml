name: CI / Deploy

# Pipeline:
#   PR (any branch)         -> test
#   push dev                -> test -> deploy(dev)
#   push main               -> test -> deploy(prod)
# (E2E job removed — Playwright browser install repeatedly hung and burned
#  Actions minutes; run `pnpm test:e2e` locally against a deployment instead.)
#
# Required secrets (see docs/deploy.md):
#   ENV_ALCHEMY                       — CF auth + alchemy state token (control plane)
#   ENV_SERVER_DEV / ENV_SERVER_PROD  — server-specific (R2 keys, domains)
#   ENV_WEB_DEV    / ENV_WEB_PROD     — web-specific (domains, NEXT_PUBLIC_*)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    # Hard cap: a hung job must never burn hours of Actions quota.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint + format + import-sort (biome ci)
        run: pnpm exec biome ci

      - name: Type-check
        run: pnpm typecheck

      - name: Unit / integration tests
        run: pnpm test

      # Note: web build is exercised by `alchemy deploy` in the deploy
      # job. Running `vite build` here would fail because alchemy's vite
      # plugin requires .alchemy/local/wrangler.jsonc, generated only by
      # alchemy dev/deploy.

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }})
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Hard cap: a hung job must never burn hours of Actions quota.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Inject .alchemy.env (control plane)
        env:
          ALCHEMY_ENV_FILE_CONTENT: ${{ secrets.ENV_ALCHEMY }}
        run: printf '%s\n' "$ALCHEMY_ENV_FILE_CONTENT" > .alchemy.env

      - name: Inject app env files (dev)
        if: github.ref == 'refs/heads/dev'
        env:
          SERVER_ENV_FILE_CONTENT: ${{ secrets.ENV_SERVER_DEV }}
          WEB_ENV_FILE_CONTENT: ${{ secrets.ENV_WEB_DEV }}
        run: |
          printf '%s\n' "$SERVER_ENV_FILE_CONTENT" > apps/server/.dev.env
          printf '%s\n' "$WEB_ENV_FILE_CONTENT" > apps/web/.dev.env

      - name: Inject app env files (prod)
        if: github.ref == 'refs/heads/main'
        env:
          SERVER_ENV_FILE_CONTENT: ${{ secrets.ENV_SERVER_PROD }}
          WEB_ENV_FILE_CONTENT: ${{ secrets.ENV_WEB_PROD }}
        run: |
          printf '%s\n' "$SERVER_ENV_FILE_CONTENT" > apps/server/.prod.env
          printf '%s\n' "$WEB_ENV_FILE_CONTENT" > apps/web/.prod.env

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE=$([ "${{ github.ref }}" = "refs/heads/main" ] && echo prod || echo dev)
          pnpm run "deploy:$STAGE"
