name: CI / Deploy

# Pipeline:
#   PR (any branch)         -> test
#   push dev                -> test -> deploy(dev)  -> e2e against dev deployment URL
#   push main               -> test -> deploy(prod) -> e2e against prod deployment URL (smoke)
#
# Required secrets (see docs/deploy.md):
#   ENV_SERVER_DEV / ENV_SERVER_PROD — full apps/server/.{dev,prod}.env contents
#   ENV_WEB_DEV    / ENV_WEB_PROD    — full apps/web/.{dev,prod}.env contents
# Each of those env files contains CLOUDFLARE_API_TOKEN, CLOUDFLARE_EMAIL,
# ALCHEMY_STATE_TOKEN (control plane) plus app secrets — alchemy's
# --env-file flag injects them into process.env at deploy time.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint + format + import-sort (biome ci)
        run: pnpm exec biome ci

      - name: Type-check
        run: pnpm typecheck

      - name: Unit / integration tests
        run: pnpm test

      # Note: web build is exercised by `alchemy deploy` in the deploy
      # job. Running `vite build` here would fail because alchemy's vite
      # plugin requires .alchemy/local/wrangler.jsonc, generated only by
      # alchemy dev/deploy.

  deploy:
    name: Deploy (${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }})
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_url: ${{ steps.url.outputs.base_url }}
      stage: ${{ steps.url.outputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Inject env files (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "${{ secrets.ENV_SERVER_DEV }}" > apps/server/.dev.env
          echo "${{ secrets.ENV_WEB_DEV }}" > apps/web/.dev.env

      - name: Inject env files (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.ENV_SERVER_PROD }}" > apps/server/.prod.env
          echo "${{ secrets.ENV_WEB_PROD }}" > apps/web/.prod.env

      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE=$([ "${{ github.ref }}" = "refs/heads/main" ] && echo prod || echo dev)
          pnpm --filter server "deploy:$STAGE"
          pnpm --filter web "deploy:$STAGE"

      - name: Resolve frontend URL
        id: url
        run: |
          STAGE=$([ "${{ github.ref }}" = "refs/heads/main" ] && echo prod || echo dev)
          URLS=$(node --env-file "apps/server/.$STAGE.env" scripts/resolve-urls.ts --stage "$STAGE")
          echo "base_url=$(echo "$URLS" | jq -r .web)" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (deployed)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run E2E against deployed URL
        run: pnpm --filter web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.base_url }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          retention-days: 7
